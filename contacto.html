<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Galería de Arte</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
        <img src="img/logo_ipss.webp" width="92" height="auto" alt="imagen IPSS" />
      <h1>Contáctanos</h1>
    </header>
    <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="galeria.html">Galería</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    <main>
      <section>
        <h2>Formulario de Contacto</h2>
        <form>
          <label>Nombre: <input type="text" required /></label><br />
          <label>Email: <input type="email" required /></label><br />
          <label
            >Tipo de Solicitud:
            <select required>
              <option value="">Seleccione una opción</option>
              <option value="compra">Compra</option>
              <option value="consulta">Consulta</option>
              <option value="venta">Venta</option>
            </select> </label
          ><br />
          <label>Mensaje: <textarea rows="5" required></textarea></label><br />
          <button type="submit">Enviar</button>
        </form>
        <h2>Información de Contacto</h2>
        <p>Dirección: Calle Falsa 123, Santiago, Chile</p>
        <p>Teléfono: +56 2 1234 5678</p>
      </section>
    </main>
    <footer>&copy; 2024 Galería de Arte. Todos los derechos reservados.</footer>
  </body>
</html>
